[project]
name = "vmarket"
version = "0.1.0"
description = "Marketplace řídicí rovina: prodává izolované Instance Aplikací."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "types-pyyaml>=6.0.12",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py312"
cache-dir = "/tmp/ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "SIM", "RUF", "N"]
ignore = ["S101", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
cache_dir = "/tmp/mypy-cache"
files = ["vmarket", "tests"]
